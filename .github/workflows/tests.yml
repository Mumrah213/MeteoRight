name: Tests

on:
  push:
    branches: [main, main-integration]
  pull_request:
    branches: [main, main-integration]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest tests/ -v --tb=short -m "not network"

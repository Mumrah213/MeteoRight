[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteoright"
version = "1.0.0"
description = "A local Open-Meteo weather analysis laboratory for historical forecasts, observations, and forecast verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "httpx>=0.25",
    "matplotlib>=3.7",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    "ruff>=0.13",
]
# The natural-language agent lives in the separate `meteoright-agent` package
# (LangGraph + an OpenAI-compatible LLM). Install that to use `meteoright-agent`.

[project.scripts]
meteoright = "cli:main"

# Top-level single-file modules that back the console script and CLI helpers.
[tool.setuptools]
py-modules = ["cli", "model_comparison", "model_canary"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "analysis",
    "config",
    "data",
    "datasets",
    "downloader",
    "forecast*",
    "historical",
    "metrics",
    "plots",
    "util",
    "verification",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "tests_*.py"]
markers = [
    "network: live Open-Meteo API tests",
]

[tool.meteoright.test_suites]
smoke = [
    "tests/test_import.py",
    "tests/test_cli.py",
    "tests/test_models.py",
    "tests/test_io.py",
    "tests/test_metrics.py",
    "tests/test_aggregations.py",
    "tests/test_confusion.py",
    "tests/test_skill_scores.py",
    "tests/test_location_invariants.py",
    "tests/test_download_dataset.py",
    "tests/test_e2e.py",
]
full = ["tests/"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["scripts/legacy/*", "examples/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",  # module-level import not at top (legitimate in __init__.py re-exports)
    "E501",  # line-too-long
    "RUF001",  # ambiguous Unicode in strings
    "RUF002",  # ambiguous Unicode in docstrings
    "RUF003",  # ambiguous Unicode in comments
    "SIM102",  # nested if statements
    "SIM108",  # ternary operator
    "SIM118",  # key in dict.keys()
    "RUF005",  # iterable unpacking vs concatenation
    "RUF015",  # next() vs single element slice
    "SIM401",  # .get() vs if-else
    "RUF022",  # __all__ not sorted
    "RUF046",  # redundant int cast
    "RUF059",  # unused unpacked variable
    "SIM105",  # contextlib.suppress vs try/except/pass
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
